<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zebros Coffee — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f9f8f6;
      --surface: #ffffff;
      --border: #ebebeb;
      --text: #1a1a1a;
      --text-2: #6b6b6b;
      --text-3: #a8a8a8;
      --accent: #1a1a1a;
      --accent-light: #f0f0f0;
      --green: #2d6a4f;
      --green-light: #f0f7f4;
      --yellow: #b45309;
      --yellow-light: #fffbeb;
      --blue: #1d4ed8;
      --blue-light: #eff6ff;
      --red: #dc2626;
      --red-light: #fef2f2;
      --radius: 16px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Sarabun', 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; }

    .btn-sound {
      background: var(--accent-light); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 6px 12px;
      font-size: 0.78rem; font-weight: 600; font-family: inherit;
      color: var(--text-2); cursor: pointer; transition: all 0.15s;
      display: flex; align-items: center; gap: 5px;
    }
    .btn-sound:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-sound.on { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* ===== LOGIN ===== */
    #loginOverlay {
      position: fixed; inset: 0; z-index: 9000;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    #loginOverlay.hidden { display: none; }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px 32px;
      max-width: 320px; width: 100%;
      text-align: center;
    }
    .login-card .lc-icon { font-size: 2.5rem; margin-bottom: 12px; }
    .login-card h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
    .login-card p  { font-size: 0.8rem; color: var(--text-3); margin-bottom: 24px; }
    .login-input-wrap { position: relative; margin-bottom: 12px; }
    .login-input-wrap input {
      width: 100%; padding: 12px 44px 12px 16px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: 1rem; font-family: inherit; letter-spacing: 4px;
      background: var(--bg); color: var(--text); transition: border-color 0.15s;
      text-align: center;
    }
    .login-input-wrap input:focus { outline: none; border-color: var(--accent); background: #fff; }
    .login-input-wrap input.shake { animation: shake 0.35s ease; border-color: var(--red); }
    @keyframes shake { 0%,100%{ transform:translateX(0) } 25%{ transform:translateX(-8px) } 75%{ transform:translateX(8px) } }
    .toggle-pw {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: var(--text-3); font-size: 1rem;
    }
    .btn-login {
      width: 100%; padding: 13px;
      background: var(--accent); color: #fff;
      border: none; border-radius: var(--radius-sm);
      font-size: 0.92rem; font-weight: 700; font-family: inherit; cursor: pointer;
    }
    .login-error { color: var(--red); font-size: 0.78rem; margin-top: 10px; min-height: 18px; }

    /* ===== HEADER ===== */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 20px 16px;
      position: sticky; top: 0; z-index: 50;
    }
    .header-inner {
      max-width: 520px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 36px; height: 36px; background: var(--accent);
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
    }
    .brand-name { font-size: 0.95rem; font-weight: 700; }
    .brand-sub  { font-size: 0.7rem; color: var(--text-3); margin-top: 1px; }

    /* toggle pill */
    .shop-toggle {
      display: flex; align-items: center; gap: 8px;
    }
    .toggle-label { font-size: 0.78rem; font-weight: 600; color: var(--text-2); }
    .toggle-track {
      width: 48px; height: 26px; border-radius: 13px;
      background: #e5e5e5; position: relative;
      cursor: pointer; transition: background 0.25s;
      border: 1px solid var(--border);
      user-select: none; -webkit-user-select: none;
    }
    .toggle-track.on { background: var(--accent); border-color: var(--accent); }
    .toggle-thumb {
      position: absolute; top: 3px; left: 3px;
      width: 18px; height: 18px; border-radius: 50%;
      background: #fff; transition: left 0.25s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    .toggle-track.on .toggle-thumb { left: 25px; }
    /* hold progress ring */
    .hold-ring {
      position: absolute; inset: -5px;
      width: 36px; height: 36px; pointer-events: none; opacity: 0; transition: opacity 0.15s;
    }
    .hold-ring.active { opacity: 1; }
    .hold-ring circle { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 88; stroke-dashoffset: 88; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset 2s linear; }
    .hold-ring.go circle { stroke-dashoffset: 0; }

    /* ===== MAIN ===== */
    main { max-width: 520px; margin: 0 auto; padding: 20px 16px 60px; }

    .section-label {
      font-size: 0.72rem; font-weight: 600; color: var(--text-3);
      text-transform: uppercase; letter-spacing: 1px;
      margin: 24px 0 10px;
    }

    /* ===== STATS ===== */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 4px; }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 10px; text-align: center;
    }
    .stat-num   { font-size: 1.5rem; font-weight: 700; line-height: 1; }
    .stat-label { font-size: 0.7rem; color: var(--text-3); margin-top: 4px; }

    /* ===== FILTER TABS ===== */
    .filter-bar {
      display: flex; gap: 6px; flex-wrap: wrap;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 6px; margin-bottom: 4px;
    }
    .ftab {
      flex: 1; padding: 8px 6px;
      background: transparent; border: none;
      border-radius: var(--radius-sm);
      font-family: inherit; font-size: 0.82rem; font-weight: 500;
      color: var(--text-2); cursor: pointer; transition: all 0.15s;
      white-space: nowrap;
    }
    .ftab:hover  { background: var(--accent-light); color: var(--text); }
    .ftab.active { background: var(--accent); color: #fff; font-weight: 600; }
    .ftab .cnt {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--red);
      margin-left: 5px;
      vertical-align: middle;
    }
    .ftab.active .cnt { background: rgba(255,255,255,0.9); }
    .ftab .cnt.hidden { display: none; }
    
    /* badge แบบตัวเลข สำหรับ tab ทั้งหมด */
    .ftab .cnt-num {
      display: inline-block; background: var(--red);
      color: #fff; font-size: 0.62rem; font-weight: 700;
      padding: 1px 5px; border-radius: 8px; margin-left: 3px;
      vertical-align: middle;
    }
    .ftab.active .cnt-num { background: rgba(255,255,255,0.3); }
    .ftab .cnt-num.hidden { display: none; }

    /* ===== ORDER CARD ===== */
    .order-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 14px 12px;
      margin-bottom: 10px;
      position: relative;
      overflow: hidden;
    }
    .order-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px; background: var(--yellow);
    }
    .order-card.accepted::before { background: var(--green); }
    .order-card.ready::before    { background: var(--blue); }

    .card-top {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 8px; flex-wrap: wrap;
    }
    .order-seq {
      background: var(--accent-light); color: var(--accent);
      font-size: 0.75rem; font-weight: 700;
      padding: 2px 9px; border-radius: 8px;
    }
    .order-name { font-weight: 700; font-size: 0.95rem; }
    .order-phone { font-size: 0.75rem; color: var(--text-3); }
    .order-time  { font-size: 0.72rem; color: var(--text-3); margin-left: auto; white-space: nowrap; }

    /* location badge — prominent */
    .location-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.82rem; font-weight: 600;
      padding: 5px 12px; border-radius: 10px;
      margin-bottom: 8px;
    }
    .location-badge.delivery {
      background: var(--blue-light); color: var(--blue);
      border: 1px solid #bfdbfe;
    }
    .location-badge.pickup {
      background: var(--green-light); color: var(--green);
      border: 1px solid #a7f3d0;
    }

    .order-items { font-size: 0.88rem; color: var(--text); line-height: 1.7; margin-bottom: 6px; }
    .order-items span { font-weight: 600; }

    .meta-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
    .meta-tag {
      background: var(--accent-light); color: var(--text-2);
      font-size: 0.75rem; font-weight: 500;
      padding: 3px 10px; border-radius: 8px;
    }
    .meta-tag.note { background: var(--yellow-light); color: var(--yellow); }

    .card-bottom {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 2px;
    }
    .order-total { font-size: 0.9rem; font-weight: 700; }

    .status-chip {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 0.72rem; font-weight: 600;
      padding: 3px 10px; border-radius: 8px;
    }
    .status-chip.pending  { background: var(--yellow-light); color: var(--yellow); }
    .status-chip.accepted { background: var(--green-light);  color: var(--green); }
    .status-chip.ready    { background: var(--blue-light);   color: var(--blue); }

    .action-row { display: flex; gap: 7px; margin-top: 10px; }
    .btn-action {
      flex: 1; padding: 9px 8px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--text);
      font-family: inherit; font-size: 0.82rem; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 5px;
    }
    .btn-action.accept { background: var(--green-light); color: var(--green); border-color: #a7f3d0; }
    .btn-action.accept:hover  { background: #d1fae5; }
    .btn-action.ready  { background: var(--blue-light);  color: var(--blue);  border-color: #bfdbfe; }
    .btn-action.ready:hover   { background: #dbeafe; }
    .btn-action:active { opacity: 0.7; }

    .empty-state {
      text-align: center; color: var(--text-3);
      padding: 40px 16px; font-size: 0.85rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .empty-state .e-emoji { font-size: 2rem; display: block; margin-bottom: 8px; }

    .top-row { display: flex; align-items: center; justify-content: space-between; margin: 24px 0 10px; }
    .top-row .section-label { margin: 0; }
    .btn-clear {
      background: none; border: 1px solid #fecaca;
      color: var(--red); border-radius: 20px;
      padding: 5px 14px; font-size: 0.75rem;
      font-family: inherit; font-weight: 600; cursor: pointer;
      transition: background 0.15s;
    }
    .btn-clear:hover { background: var(--red-light); }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginOverlay">
  <div class="login-card">
    <div class="lc-icon">☕</div>
    <h2>Zebros Coffee</h2>
    <p>ใส่รหัสผ่านเพื่อเข้าสู่ระบบแอดมิน</p>
    <div class="login-input-wrap">
      <input id="pwInput" type="password" placeholder="••••••" maxlength="20"
        onkeydown="if(event.key==='Enter') doLogin()" autofocus />
      <button class="toggle-pw" onclick="togglePw()" tabindex="-1">👁</button>
    </div>
    <button class="btn-login" onclick="doLogin()">เข้าสู่ระบบ</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-icon">☕</div>
      <div>
        <div class="brand-name">Zebros Coffee</div>
        <div class="brand-sub">หน้าจัดการออเดอร์</div>
      </div>
    </div>
    <div class="shop-toggle">
      <button class="btn-sound" id="btnSound" onclick="toggleSound()" title="เปิด/ปิดเสียงแจ้งเตือน">🔔</button>
      <span class="toggle-label" id="toggleLabel">เปิดรับออเดอร์</span>
      <div class="toggle-track on" id="toggleTrack" title="กดค้าง 2 วิ เพื่อเปลี่ยนสถานะ">
        <div class="toggle-thumb"></div>
        <svg class="hold-ring" id="holdRing" viewBox="0 0 36 36">
          <circle cx="18" cy="18" r="14"/>
        </svg>
      </div>
    </div>
  </div>
</header>

<main>
  <!-- STATS -->
  <div class="section-label" style="margin-top:4px">สรุปวันนี้</div>
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-num" id="statTotal">0</div>
      <div class="stat-label">ออเดอร์ทั้งหมด</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statPending">0</div>
      <div class="stat-label">รอดำเนินการ</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statRevenue">0</div>
      <div class="stat-label">รายได้ (฿)</div>
    </div>
  </div>

  <!-- FILTER -->
  <div class="top-row">
    <div class="section-label">รายการออเดอร์</div>
    <button class="btn-clear" onclick="clearDone()">🗑 ล้างที่เสร็จแล้ว</button>
  </div>
  <div class="filter-bar">
    <button class="ftab active" id="ftab-all"      onclick="setFilter('all',this)">ทั้งหมด <span class="cnt-num" id="cntAll">0</span></button>
    <button class="ftab"        id="ftab-pending"  onclick="setFilter('pending',this)">⏳ รอรับ <span class="cnt hidden" id="cntPending"></span></button>
    <button class="ftab"        id="ftab-accepted" onclick="setFilter('accepted',this)">🔧 เตรียม <span class="cnt hidden" id="cntAccepted"></span></button>
    <button class="ftab"        id="ftab-ready"    onclick="setFilter('ready',this)">✅ พร้อมรับ</button>
  </div>

  <!-- ORDER LIST -->
  <div id="orderList">
    <div class="empty-state"><span class="e-emoji">📭</span>ยังไม่มีออเดอร์เข้ามา</div>
  </div>
</main>

<script>
const SUPA_URL   = "https://lwzjleknmnnqwdqqivtz.supabase.co";
const SUPA_KEY   = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3empsZWtubW5ucXdkcXFpdnR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNTA0ODEsImV4cCI6MjEwNTcyNjQ4MX0.u-zr9TRWnP6DHrDMWUizh7_W6e9XF3otLQotBU-JUlk";
const ADMIN_PASS = "Earth54321";
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

// ===== LOGIN =====
function doLogin() {
  const val = document.getElementById("pwInput").value;
  if (val === ADMIN_PASS) {
    sessionStorage.setItem("adminAuth", "1");
    document.getElementById("loginOverlay").classList.add("hidden");
    loadShopState(); loadOrders(); subscribeOrders();
  } else {
    const inp = document.getElementById("pwInput");
    inp.classList.remove("shake"); void inp.offsetWidth;
    inp.classList.add("shake");
    document.getElementById("loginError").textContent = "รหัสผ่านไม่ถูกต้อง";
    inp.value = ""; inp.focus();
  }
}
function togglePw() {
  const inp = document.getElementById("pwInput");
  inp.type = inp.type === "password" ? "text" : "password";
}

// ===== SHOP STATE =====
let isOpen = true;

async function loadShopState() {
  const { data } = await sb.from("settings").select("value").eq("key", "shopOpen").single();
  if (data) isOpen = data.value === "true";
  renderShopUI();
}

function renderShopUI() {
  const track = document.getElementById("toggleTrack");
  const label = document.getElementById("toggleLabel");
  if (isOpen) {
    track.classList.add("on");
    label.textContent = "เปิดรับออเดอร์";
  } else {
    track.classList.remove("on");
    label.textContent = "ปิดรับออเดอร์";
  }
}

async function toggleShopState() {
  const newState = !isOpen;
  const { error } = await sb.from("settings").update({ value: String(newState) }).eq("key", "shopOpen");
  if (error) { console.error(error); return; }
  if (newState === true) {
    const { error: delErr } = await sb.from("orders").delete().gte("timestamp", 0);
    if (delErr) console.warn("delete orders error:", delErr.message);
    const { error: rpcErr } = await sb.rpc("reset_order_seq");
    if (rpcErr) console.warn("reset_order_seq:", rpcErr.message);
    loadOrders();
  }
  isOpen = newState;
  renderShopUI();
}

// Hold 2s to toggle
(function() {
  const track = document.getElementById("toggleTrack");
  const ring  = document.getElementById("holdRing");
  let timer = null, holding = false;
  function start() {
    if (holding) return; holding = true;
    ring.classList.add("active","go");
    timer = setTimeout(() => { stop(); toggleShopState(); }, 2000);
  }
  function stop() {
    holding = false; clearTimeout(timer);
    ring.classList.remove("go");
    setTimeout(() => ring.classList.remove("active"), 200);
  }
  track.addEventListener("mousedown",   start);
  track.addEventListener("touchstart",  start, { passive: true });
  track.addEventListener("mouseup",     stop);
  track.addEventListener("mouseleave",  stop);
  track.addEventListener("touchend",    stop);
  track.addEventListener("touchcancel", stop);
})();

// ===== ORDERS =====
let allOrders = [], currentFilter = "all";
let knownOrderIds = null; // null = ยังไม่ได้ init
let isLoadingOrders = false; // ป้องกัน concurrent calls

// ===== SOUND & NOTIFICATION =====
let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  // resume ถ้า suspended (browser policy)
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

// unlock AudioContext ตอน user แตะหน้าจอครั้งแรก
document.addEventListener("click",     () => getAudioCtx(), { once: true });
document.addEventListener("touchstart",() => getAudioCtx(), { once: true });

function playNewOrderSound() {
  if (!soundEnabled) return;
  try {
    const ctx = getAudioCtx();
    const notes = [
      { freq: 880,  start: 0.0,  dur: 0.18 },
      { freq: 1100, start: 0.22, dur: 0.18 },
      { freq: 1320, start: 0.44, dur: 0.28 },
    ];
    notes.forEach(({ freq, start, dur }) => {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, ctx.currentTime + start);
      gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + dur + 0.05);
    });
  } catch (e) { console.warn("Audio error:", e); }
}

function sendNotification(order) {
  if (!("Notification" in window)) return;
  if (Notification.permission !== "granted") return;
  const items = order.items.map(i => `${i.name}×${i.qty}`).join(", ");
  new Notification(`🛎️ ออเดอร์ใหม่ #${String(order.order_seq||"").padStart(4,"0")}`, {
    body: `${order.name} · ${items} · ${order.total}฿`,
    icon: "images/corgi.jpg",
    badge: "images/corgi.jpg",
  });
}

function requestNotifyPermission() {
  if ("Notification" in window && Notification.permission === "default") {
    Notification.requestPermission();
  }
}

let soundEnabled = true;
function toggleSound() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById("btnSound");
  btn.textContent = soundEnabled ? "🔔" : "🔕";
  btn.classList.toggle("on", soundEnabled);
  if (soundEnabled) {
    getAudioCtx(); // unlock แล้วทดสอบเสียง
    playNewOrderSound();
  }
}

// flash title tab
let titleFlash = null;
function flashTitle(order) {
  let on = true;
  clearInterval(titleFlash);
  titleFlash = setInterval(() => {
    document.title = on
      ? `🛎️ ออเดอร์ใหม่! #${String(order.order_seq||"").padStart(4,"0")}`
      : "Zebros Coffee — Admin";
    on = !on;
  }, 700);
  setTimeout(() => {
    clearInterval(titleFlash);
    document.title = "Zebros Coffee — Admin";
  }, 8000);
}

async function loadOrders() {
  if (isLoadingOrders) return; // ป้องกัน call ซ้อน
  isLoadingOrders = true;
  try {
    const { data, error } = await sb.from("orders").select("*").order("timestamp", { ascending: false });
    if (error) { console.error(error); return; }
    const orders = (data || []).map(o => ({
      ...o, items: typeof o.items === "string" ? JSON.parse(o.items) : (o.items || [])
    }));

    // ตรวจจับ order ใหม่ที่เพิ่งเข้า
    if (knownOrderIds !== null) {
      const newOrders = orders.filter(o =>
        o.status === "pending" && !knownOrderIds.has(o.id)
      );
      if (newOrders.length > 0) {
        playNewOrderSound();
        newOrders.forEach(o => {
          sendNotification(o);
          flashTitle(o);
        });
      }
    }
    knownOrderIds = new Set(orders.map(o => o.id));
    allOrders = orders;
    renderOrders();
  } finally {
    isLoadingOrders = false;
  }
}

function subscribeOrders() {
  sb.channel("admin-orders")
    .on("postgres_changes", { event: "*", schema: "public", table: "orders" }, () => loadOrders())
    .subscribe();
  // poll ทุก 2 วิ เป็น fallback กรณี WebSocket ขาด
  setInterval(loadOrders, 2000);
}

async function acceptOrder(id) {
  // ซ่อน card ทันทีเพื่อ UX ดีขึ้น
  const card = document.getElementById("card-" + id);
  if (card) card.style.opacity = "0.3";
  await sb.from("orders").update({ status: "accepted" }).eq("id", id);
  await loadOrders();
}
async function readyOrder(id) {
  const card = document.getElementById("card-" + id);
  if (card) card.style.opacity = "0.3";
  await sb.from("orders").update({ status: "ready" }).eq("id", id);
  await loadOrders();
}
async function clearDone() {
  await sb.from("orders").delete().eq("status", "ready");
  loadOrders();
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll(".ftab").forEach(b => b.classList.remove("active"));
  el.classList.add("active");
  renderOrders();
}

function formatTime(ts) {
  return new Date(ts).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" });
}

function locationBadge(loc) {
  if (!loc) return '';
  const isDelivery = loc && !loc.includes("มารับ") && !loc.includes("เคาน์เตอร์") && loc.trim() !== "";
  // ถ้าลูกค้าพิมพ์ที่อยู่ = ส่ง, ถ้าพิมพ์ว่ามารับ/เคาน์เตอร์ = รับเอง
  const pickup = loc.toLowerCase().includes("รับ") || loc.toLowerCase().includes("counter") || loc.toLowerCase().includes("เคาน์");
  if (pickup) {
    return `<div class="location-badge pickup">🏃 รับที่เคาน์เตอร์ &nbsp;·&nbsp; ${loc}</div>`;
  } else {
    return `<div class="location-badge delivery">🛵 ส่ง &nbsp;·&nbsp; ${loc}</div>`;
  }
}

function renderOrders() {
  const pending  = allOrders.filter(o => o.status === "pending");
  const accepted = allOrders.filter(o => o.status === "accepted");
  const ready    = allOrders.filter(o => o.status === "ready");
  const revenue  = allOrders.reduce((s, o) => s + (o.total || 0), 0);

  document.getElementById("statTotal").textContent   = allOrders.length;
  document.getElementById("statPending").textContent = pending.length;
  document.getElementById("statRevenue").textContent = revenue;

  // อัปเดต badge:
  // - ทั้งหมด = ตัวเลข
  // - รอรับ, เตรียม = จุดแดง
  // - พร้อมรับ = ไม่มีอะไร
  
  const cntAllEl = document.getElementById("cntAll");
  if (cntAllEl) {
    cntAllEl.textContent = allOrders.length;
    if (allOrders.length > 0) cntAllEl.classList.remove("hidden");
    else cntAllEl.classList.add("hidden");
  }
  
  function setDot(id, count) {
    const el = document.getElementById(id);
    if (!el) return;
    if (count > 0) el.classList.remove("hidden");
    else el.classList.add("hidden");
  }
  setDot("cntPending",  pending.length);
  setDot("cntAccepted", accepted.length);

  // re-activate tab ที่ถูก filter อยู่ (realtime อาจ reset active class)
  document.querySelectorAll(".ftab").forEach(b => b.classList.remove("active"));
  const activeTab = document.getElementById("ftab-" + (currentFilter === "all" ? "all" : currentFilter));
  if (activeTab) activeTab.classList.add("active");

  const filtered = currentFilter === "all" ? allOrders : allOrders.filter(o => o.status === currentFilter);
  const list = document.getElementById("orderList");

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-state"><span class="e-emoji">📭</span>ไม่มีออเดอร์ในหมวดนี้</div>`;
    return;
  }

  const statusChip = {
    pending:  `<span class="status-chip pending">⏳ รอรับออเดอร์</span>`,
    accepted: `<span class="status-chip accepted">🔧 กำลังเตรียม</span>`,
    ready:    `<span class="status-chip ready">✅ พร้อมรับแล้ว</span>`,
  };

  list.innerHTML = filtered.map(o => `
    <div class="order-card ${o.status}" id="card-${o.id}">
      <div class="card-top">
        <span class="order-seq">#${String(o.order_seq || "").padStart(4,"0")}</span>
        <span class="order-name">${o.name}</span>
        ${o.phone ? `<span class="order-phone">📞 ${o.phone}</span>` : ""}
        <span class="order-time">${formatTime(o.timestamp)}</span>
      </div>

      ${locationBadge(o.location)}

      <div class="order-items">
        ${o.items.map(i => `<span>${i.name}</span> ×${i.qty}`).join(" &nbsp;·&nbsp; ")}
      </div>

      <div class="meta-row">
        <span class="meta-tag">🍬 ${o.sweet}</span>
        <span class="meta-tag">🧊 ${o.temp}</span>
        ${o.note ? `<span class="meta-tag note">📌 ${o.note}</span>` : ""}
      </div>

      <div class="card-bottom">
        <span class="order-total">รวม ${o.total} ฿</span>
        ${statusChip[o.status] || ""}
      </div>

      <div class="action-row">
        ${o.status === "pending"  ? `<button class="btn-action accept" onclick="acceptOrder('${o.id}')">✓ รับออเดอร์</button>` : ""}
        ${o.status === "accepted" ? `<button class="btn-action ready"  onclick="readyOrder('${o.id}')">🛍️ พร้อมแล้ว</button>` : ""}
      </div>
    </div>
  `).join("");
}

// ===== INIT =====
if (sessionStorage.getItem("adminAuth") === "1") {
  document.getElementById("loginOverlay").classList.add("hidden");
  loadShopState(); loadOrders(); subscribeOrders();
  requestNotifyPermission();
} else {
  renderShopUI();
}
</script>
</body>
