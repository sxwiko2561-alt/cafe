<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zebros Coffee</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f9f8f6;
      --surface: #ffffff;
      --border: #ebebeb;
      --text: #1a1a1a;
      --text-2: #6b6b6b;
      --text-3: #a8a8a8;
      --accent: #1a1a1a;
      --accent-light: #f0f0f0;
      --green: #2d6a4f;
      --green-light: #f0f7f4;
      --radius: 16px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }

    body {
      font-family: 'Sarabun', 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 15px;
    }

    /* ===== HEADER ===== */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 20px 20px 16px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-inner {
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .brand-icon svg { width: 18px; height: 18px; stroke: #fff; stroke-width: 2; }
    .brand-name { font-size: 1rem; font-weight: 600; letter-spacing: -0.3px; }
    .brand-sub  { font-size: 0.72rem; color: var(--text-3); margin-top: 1px; }

    .status-pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 12px; border-radius: 20px;
      font-size: 0.72rem; font-weight: 500;
      background: var(--green-light); color: var(--green);
      border: 1px solid #c8e6d8;
    }
    .status-pill .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; } 50% { opacity: 0.4; }
    }
    .status-pill.closed { background: #fef2f2; color: #dc2626; border-color: #fecaca; }
    .status-pill.closed .dot { background: #dc2626; animation: none; }

    /* ===== MY ORDER BAR ===== */
    #myOrderBar { display: none; }
    .order-status-card {
      max-width: 480px; margin: 12px auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      animation: slideDown 0.3s ease;
    }
    @keyframes slideDown {
      from { transform: translateY(-8px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    .osc-top {
      display: flex; align-items: center; gap: 12px; margin-bottom: 12px;
    }
    .osc-icon-wrap {
      width: 40px; height: 40px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .osc-icon-wrap.pending  { background: #fffbeb; }
    .osc-icon-wrap.accepted { background: #f0fdf4; }
    .osc-icon-wrap.ready    { background: #eff6ff; }
    .osc-icon-wrap svg { width: 20px; height: 20px; stroke-width: 2; }
    .osc-icon-wrap.pending  svg { stroke: #d97706; }
    .osc-icon-wrap.accepted svg { stroke: #16a34a; }
    .osc-icon-wrap.ready    svg { stroke: #2563eb; }
    .osc-title { font-size: 0.92rem; font-weight: 600; }
    .osc-sub   { font-size: 0.75rem; color: var(--text-2); margin-top: 2px; }

    /* step progress */
    .step-bar {
      display: flex; align-items: center; gap: 0;
      margin-bottom: 14px;
    }
    .step-item {
      display: flex; flex-direction: column; align-items: center;
      flex: 1; position: relative;
    }
    .step-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--border); position: relative; z-index: 1;
    }
    .step-dot.active   { background: var(--accent); }
    .step-dot.done     { background: var(--accent); }
    .step-label {
      font-size: 0.65rem; color: var(--text-3); margin-top: 5px;
      white-space: nowrap;
    }
    .step-label.active { color: var(--text); font-weight: 600; }
    .step-line {
      flex: 1; height: 1px; background: var(--border);
      margin-top: -12px;
    }
    .step-line.done { background: var(--accent); }

    .btn-new-order {
      width: 100%; padding: 11px;
      background: var(--accent); color: #fff;
      border: none; border-radius: var(--radius-sm);
      font-size: 0.85rem; font-weight: 600; font-family: inherit;
      cursor: pointer; letter-spacing: 0.2px;
    }

    /* ===== CLOSED OVERLAY ===== */
    .closed-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
      z-index: 200; align-items: center; justify-content: center; padding: 24px;
    }
    .closed-overlay.show { display: flex; }
    .closed-card {
      background: var(--surface); border-radius: 24px;
      padding: 40px 28px 32px; max-width: 300px; width: 100%;
      text-align: center; animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }
    .closed-card .c-icon {
      width: 56px; height: 56px; border-radius: 16px;
      background: #fef2f2; margin: 0 auto 16px;
      display: flex; align-items: center; justify-content: center;
    }
    .closed-card .c-icon svg { width: 28px; height: 28px; stroke: #dc2626; stroke-width: 1.8; }
    .closed-card h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; }
    .closed-card p  { font-size: 0.82rem; color: var(--text-2); line-height: 1.6; }

    /* ===== MAIN ===== */
    main { max-width: 480px; margin: 0 auto; padding: 20px 16px 120px; }

    /* ===== TABS ===== */
    .tabs-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px;
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 8px;
      background: transparent;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-2);
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn:hover {
      background: var(--accent-light);
      color: var(--text);
    }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    .section-label {
      font-size: 0.72rem; font-weight: 600; color: var(--text-3);
      text-transform: uppercase; letter-spacing: 1px;
      margin: 28px 0 12px;
    }

    /* ===== MENU GRID ===== */
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .menu-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden; cursor: pointer;
      transition: transform 0.18s, box-shadow 0.18s;
    }
    .menu-card:active { transform: scale(0.97); }
    .menu-card:hover  { box-shadow: 0 8px 24px rgba(0,0,0,0.08); }

    .menu-card .img-wrap {
      width: 100%; aspect-ratio: 1;
      background: #f5f5f5; overflow: hidden; position: relative;
    }
    .menu-card .img-wrap img {
      width: 100%; height: 100%;
      object-fit: cover; object-position: center 20%;
      transition: transform 0.35s;
    }
    .menu-card:hover .img-wrap img { transform: scale(1.05); }
    .icon-fallback {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #f5f5f5;
    }
    .icon-fallback svg { width: 40px; height: 40px; stroke: #ccc; stroke-width: 1.5; }

    .price-chip {
      position: absolute; bottom: 8px; left: 8px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(4px);
      padding: 3px 10px; border-radius: 20px;
      font-size: 0.78rem; font-weight: 600; color: var(--text);
    }

    .menu-card .card-body {
      padding: 10px 12px 12px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .card-name { font-size: 0.82rem; font-weight: 500; line-height: 1.3; flex: 1; }

    .btn-add {
      width: 28px; height: 28px; border-radius: 8px;
      background: var(--accent); color: #fff;
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: opacity 0.15s;
    }
    .btn-add svg { width: 14px; height: 14px; stroke: #fff; stroke-width: 2.5; }
    .btn-add:active { opacity: 0.7; }

    /* ===== CART ===== */
    .cart-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .cart-empty-state {
      padding: 32px 16px; text-align: center;
      color: var(--text-3); font-size: 0.82rem;
    }
    .cart-empty-state svg { width: 32px; height: 32px; stroke: #ddd; stroke-width: 1.5; display: block; margin: 0 auto 8px; }

    .cart-row {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; border-bottom: 1px solid var(--border);
    }
    .cart-row:last-of-type { border-bottom: none; }
    .cart-thumb {
      width: 40px; height: 40px; border-radius: 10px;
      object-fit: cover; object-position: center 20%;
      background: #f5f5f5; flex-shrink: 0;
    }
    .cart-thumb-icon {
      width: 40px; height: 40px; border-radius: 10px;
      background: #f5f5f5; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .cart-thumb-icon svg { width: 18px; height: 18px; stroke: #ccc; }
    .cart-item-name { flex: 1; font-size: 0.82rem; font-weight: 500; }
    .qty-ctrl { display: flex; align-items: center; gap: 10px; }
    .qty-btn {
      width: 24px; height: 24px; border-radius: 6px;
      background: var(--accent-light); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; color: var(--text); font-size: 1rem;
    }
    .qty-btn:active { opacity: 0.6; }
    .qty-num { font-size: 0.85rem; font-weight: 600; min-width: 16px; text-align: center; }
    .item-price { font-size: 0.82rem; font-weight: 600; color: var(--text); min-width: 48px; text-align: right; }

    .cart-total-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      font-weight: 600; font-size: 0.88rem;
    }
    .cart-total-row .total-val { font-size: 1rem; }

    /* ===== FORM ===== */
    .form-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }
    .form-field { margin-bottom: 14px; }
    .form-field label {
      display: block; font-size: 0.72rem; font-weight: 600;
      color: var(--text-2); margin-bottom: 6px; letter-spacing: 0.3px;
    }
    .form-field input, .form-field textarea {
      width: 100%; padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.88rem; font-family: inherit;
      background: var(--bg); color: var(--text);
      transition: border-color 0.15s;
    }
    .form-field input:focus, .form-field textarea:focus {
      outline: none; border-color: var(--text); background: #fff;
    }
    textarea { resize: none; height: 72px; }

    /* option tags */
    .tag-group { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      padding: 6px 14px; border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--bg);
      font-size: 0.78rem; font-family: inherit; cursor: pointer;
      transition: all 0.15s; color: var(--text-2); font-weight: 500;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .tag svg { width: 12px; height: 12px; stroke: currentColor; }
    .tag:hover  { border-color: var(--text); color: var(--text); }
    .tag.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .divider { height: 1px; background: var(--border); margin: 14px 0; }

    /* ===== SUBMIT ===== */
    .btn-submit {
      width: 100%; padding: 14px;
      background: var(--accent); color: #fff;
      border: none; border-radius: var(--radius-sm);
      font-size: 0.92rem; font-weight: 600; font-family: inherit;
      cursor: pointer; letter-spacing: 0.3px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: opacity 0.15s;
      margin-top: 4px;
    }
    .btn-submit svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 2.2; }
    .btn-submit:active  { opacity: 0.8; }
    .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ===== CART FAB ===== */
    .fab-wrap {
      position: fixed; bottom: 24px; right: 16px;
      z-index: 99;
    }
    .fab {
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--surface); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      transition: transform 0.2s;
      overflow: hidden; padding: 0;
    }
    .fab:active { transform: scale(0.93); }
    .fab-badge {
      position: absolute; top: -4px; right: -4px;
      background: #ef4444; color: #fff;
      font-size: 0.6rem; font-weight: 700;
      min-width: 18px; height: 18px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 4px; border: 2px solid var(--bg);
    }
    .fab-badge.hidden { display: none; }

    /* ===== SUCCESS MODAL ===== */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 100;
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--surface); border-radius: 24px;
      padding: 32px 24px 24px; max-width: 320px; width: 100%;
      text-align: center; animation: popIn 0.25s cubic-bezier(0.34,1.56,0.64,1);
    }
    .modal-icon-wrap {
      width: 56px; height: 56px; border-radius: 16px;
      background: var(--green-light); margin: 0 auto 16px;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-icon-wrap svg { width: 28px; height: 28px; stroke: var(--green); stroke-width: 2; }
    .modal h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 6px; }
    .order-num {
      display: inline-block; background: var(--accent-light);
      padding: 4px 16px; border-radius: 20px;
      font-size: 0.92rem; font-weight: 600;
      margin: 8px 0;
    }
    .modal p { font-size: 0.8rem; color: var(--text-2); line-height: 1.6; }
    .btn-modal-close {
      width: 100%; margin-top: 16px; padding: 12px;
      background: var(--accent); color: #fff;
      border: none; border-radius: var(--radius-sm);
      font-size: 0.88rem; font-weight: 600; font-family: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-icon"><i data-lucide="coffee"></i></div>
      <div>
        <div class="brand-name">Zebros Coffee</div>
        <div class="brand-sub">สั่งง่าย รับที่ร้าน</div>
      </div>
    </div>
    <div class="status-pill" id="statusPill">
      <span class="dot"></span> เปิดรับออเดอร์
    </div>
  </div>
</header>

<!-- MY ORDER STATUS -->
<div id="myOrderBar" style="padding:0 16px"></div>

<!-- CLOSED OVERLAY -->
<div class="closed-overlay" id="closedOverlay">
  <div class="closed-card">
    <div class="c-icon"><i data-lucide="moon"></i></div>
    <h2>พักก่อนนะ ☕</h2>
    <p>ตอนนี้ยังไม่เปิดรับออเดอร์<br>แต่กาแฟมัทฉะเย็นๆ กำลังรอคุณอยู่<br><br>✨ <strong>กลับมาเร็วๆ นี้ แล้วเราจัดให้ทันที!</strong></p>
  </div>
</div>

<main>
  <!-- TABS -->
  <div class="tabs-container">
    <button class="tab-btn active" data-category="กาแฟ">☕ กาแฟ</button>
    <button class="tab-btn" data-category="ชานม">🥤 ชานม</button>
    <button class="tab-btn" data-category="มัทฉะ">🍵 มัทฉะ</button>
  </div>

  <!-- MENU -->
  <div class="section-label" id="menuLabel">เมนูกาแฟ</div>
  <div class="menu-grid" id="menuGrid"></div>

  <!-- CART -->
  <div class="section-label">ตะกร้า</div>

      <i data-lucide="shopping-bag"></i>

    </div>
  </div>

  <!-- FORM -->
  <div class="section-label">ข้อมูลผู้สั่ง</div>
  <div class="form-box">
    <div class="form-field">
      <label>ชื่อ *</label>
      <input id="custName" type="text" placeholder="ชื่อของคุณ" />
    </div>
    <div class="form-field">
      <label>สถานที่ส่ง / มารับเอง</label>
      <input id="custLocation" type="text" placeholder="เช่น โต๊ะ A1, มารับเองที่เคาน์เตอร์" />
    </div>
    <div class="form-field">
      <label>เบอร์โทร</label>
      <input id="custPhone" type="tel" placeholder="08x-xxx-xxxx" />
    </div>
    <div class="divider"></div>
    <div class="form-field">
      <label>ความหวาน</label>
      <div class="tag-group" id="sweetTags">
        <button class="tag active" data-val="ปกติ">ปกติ</button>
        <button class="tag" data-val="หวานน้อย">หวานน้อย</button>
        <button class="tag" data-val="หวานน้อยมาก">หวานน้อยมาก</button>
        <button class="tag" data-val="ไม่หวาน">ไม่หวาน</button>
      </div>
    </div>
    <div class="form-field">
      <label>อุณหภูมิ</label>
      <div class="tag-group" id="tempTags">
        <button class="tag active" data-val="เย็น"><i data-lucide="snowflake"></i>เย็น</button>
        <button class="tag" data-val="ปั่น"><i data-lucide="wind"></i>ปั่น</button>
      </div>
    </div>
    <div class="divider"></div>
    <div class="form-field">
      <label>หมายเหตุ</label>
      <textarea id="custNote" placeholder="เช่น ไม่ใส่น้ำแข็ง, นมข้น..."></textarea>
    </div>
    <button class="btn-submit" id="btnOrder" onclick="submitOrder()">
      <i data-lucide="arrow-right"></i> สั่งเลย
    </button>
  </div>
</main>

<!-- FAB -->
<div class="fab-wrap">
  <button class="fab" onclick="scrollToCart()">
    <img src="images/corgi.jpg" alt="corgi" style="width:70%;height:70%;object-fit:contain;border-radius:0;" />
  </button>
  <span class="fab-badge hidden" id="fabBadge">0</span>
</div>

<!-- SUCCESS MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-icon-wrap"><i data-lucide="check"></i></div>
    <h2>สั่งสำเร็จแล้ว</h2>
    <p>หมายเลขออเดอร์</p>
    <div class="order-num" id="modalOrderId">#0001</div>
    <p id="modalSummary"></p>
    <button class="btn-modal-close" onclick="closeModal()">ตกลง</button>
  </div>
</div>

let cart = {}, sweet = "ปกติ", temp = "เย็น";
let currentCategory = "กาแฟ";

// ===== SHOP STATE — simple polling every 3 seconds =====
async function pollShopState() {
  try {
    const { data } = await sb.from("settings").select("value").eq("key", "shopOpen").single();
    const isOpen = data ? data.value === "true" : true;
    applyShopState(isOpen);
  } catch (e) {
    // network error — leave current state as-is
  }
}

function applyShopState(isOpen) {
  const pill    = document.getElementById("statusPill");
  const overlay = document.getElementById("closedOverlay");
  if (isOpen) {
    overlay.classList.remove("show");
    pill.className = "status-pill";
    pill.innerHTML = '<span class="dot"></span> เปิดรับออเดอร์';
  } else {
    overlay.classList.add("show");
    pill.className = "status-pill closed";
    pill.innerHTML = '<span class="dot"></span> ปิดรับออเดอร์';
  }
}

// Poll immediately on load, then every 3 seconds
pollShopState();
setInterval(pollShopState, 3000);

// ===== MENU =====
function renderMenu() {
  const menuItems = MENU[currentCategory] || [];
  document.getElementById("menuGrid").innerHTML = menuItems.map(item => `
    <div class="menu-card" onclick="addToCart(${item.id})">
      <div class="img-wrap">
        ${item.img ? `<img src="${item.img}" alt="${item.name}"
          onerror="this.style.display='none';document.getElementById('if-${item.id}').style.display='flex'" loading="lazy"/>` : ''}
        <div class="icon-fallback" id="if-${item.id}" style="display:${item.img ? 'none' : 'flex'}">
          <i data-lucide="cup-soda"></i>
        </div>
        <span class="price-chip">${item.price} ฿</span>
      </div>
      <div class="card-body">
        <span class="card-name">${item.name}</span>
        <button class="btn-add" onclick="event.stopPropagation();addToCart(${item.id})">
          <i data-lucide="plus"></i>
        </button>
      </div>
    </div>`).join("");
  lucide.createIcons();
}

function switchCategory(category) {
  currentCategory = category;
  
  // Update tab buttons
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.category === category);
  });
  
  // Update section label
  const labels = {
    'กาแฟ': 'เมนูกาแฟ',
    'ชานม': 'เมนูชานม',
    'มัทฉะ': 'เมนูมัทฉะ'
  };
  document.getElementById('menuLabel').textContent = labels[category] || 'เมนู';
  
  renderMenu();
}

// ===== CART =====
function addToCart(id) {
  cart[id] = (cart[id] || 0) + 1;
  renderCart();
  const fab = document.querySelector(".fab");
  fab.style.transform = "scale(1.2)";
  setTimeout(() => fab.style.transform = "", 180);
}
function changeQty(id, d) {
  cart[id] = (cart[id] || 0) + d;
  if (cart[id] <= 0) delete cart[id];
  renderCart();
}
function renderCart() {
  const box  = document.getElementById("cartBox");
  const keys = Object.keys(cart);
  if (!keys.length) {
    box.innerHTML = `<div class="cart-empty-state"><i data-lucide="shopping-bag"></i>ยังไม่มีรายการ</div>`;
    updateFab(0); lucide.createIcons(); return;
  }
  let sum = 0, qty = 0;
  const rows = keys.map(id => {
    // Find item across all categories
    let item = null;
    for (let cat in MENU) {
      item = MENU[cat].find(m => m.id == id);
      if (item) break;
    }
    if (!item) return '';
    
    const q = cart[id], sub = item.price * q;
    sum += sub; qty += q;
    return `<div class="cart-row">
      ${item.img ? `<img class="cart-thumb" src="${item.img}" alt="${item.name}"
        onerror="this.outerHTML='<div class=cart-thumb-icon><i data-lucide=cup-soda></i></div>'"/>` 
        : '<div class="cart-thumb-icon"><i data-lucide="cup-soda"></i></div>'}
      <span class="cart-item-name">${item.name}</span>
      <div class="qty-ctrl">
        <button class="qty-btn" onclick="changeQty(${id},-1)">−</button>
        <span class="qty-num">${q}</span>
        <button class="qty-btn" onclick="changeQty(${id},+1)">+</button>
      </div>
      <span class="item-price">${sub} ฿</span>
    </div>`;
  }).join("");
  box.innerHTML = rows + `<div class="cart-total-row"><span>รวม</span><span class="total-val">${sum} ฿</span></div>`;
  updateFab(qty); lucide.createIcons();
}
function updateFab(q) {
  const b = document.getElementById("fabBadge");
  q > 0 ? (b.textContent = q, b.classList.remove("hidden")) : b.classList.add("hidden");
}

// ===== TAGS =====
function initTags() {
  ["sweetTags","tempTags"].forEach(id => {
    document.getElementById(id).addEventListener("click", e => {
      const btn = e.target.closest(".tag"); if (!btn) return;
      document.querySelectorAll(`#${id} .tag`).forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      if (id === "sweetTags") sweet = btn.dataset.val;
      else temp = btn.dataset.val;
    });
  });
}

// ===== SUBMIT =====
async function submitOrder() {
  // Check shop state before submitting
  const { data: setting } = await sb.from("settings").select("value").eq("key", "shopOpen").single();
  const isOpen = setting ? setting.value === "true" : true;
  if (!isOpen) { applyShopState(false); return; }

  const name = document.getElementById("custName").value.trim();
  if (!name) { document.getElementById("custName").focus(); return; }
  if (!Object.keys(cart).length) return;

  const btn = document.getElementById("btnOrder");
  btn.disabled = true;
  const phone    = document.getElementById("custPhone").value.trim();
  const location = document.getElementById("custLocation").value.trim();
  const note     = document.getElementById("custNote").value.trim();
  
  let total = 0;
  const items = Object.keys(cart).map(id => {
    // Find item across all categories
    let item = null;
    for (let cat in MENU) {
      item = MENU[cat].find(m => m.id == id);
      if (item) break;
    }
    if (!item) return null;
    
    const subtotal = item.price * cart[id];
    total += subtotal;
    return { name: item.name, qty: cart[id], price: item.price };
  }).filter(x => x !== null);

  const { data, error } = await sb.from("orders").insert([{
    name, phone, note, sweet, temp, location,
    items: JSON.stringify(items), total,
    status: "pending", timestamp: Date.now()
  }]).select().single();

  btn.disabled = false;
  if (error) { alert("เกิดข้อผิดพลาด: " + error.message); return; }

  localStorage.setItem("myOrderId", data.id);
  localStorage.setItem("myOrderStatus", "pending");
  lastKnownStatus = "pending"; lastRenderedStatus = "";

  cart = {}; renderCart();
  document.getElementById("custName").value     = "";
  document.getElementById("custLocation").value = "";
  document.getElementById("custPhone").value    = "";
  document.getElementById("custNote").value     = "";

  document.getElementById("modalOrderId").textContent = `#${String(data.order_seq).padStart(4,"0")}`;
  document.getElementById("modalSummary").innerHTML = items.map(i=>`${i.name} ×${i.qty}`).join(", ") + `<br>ความหวาน: ${sweet} · ${temp}`;
  document.getElementById("modalOverlay").classList.add("show");

  subscribeMyOrder();
}

// ===== ORDER TRACKER =====
const STATUS_ICON  = { pending:"clock", accepted:"chef-hat", ready:"package-check" };
const STATUS_LABEL = { pending:"รอการยืนยัน", accepted:"กำลังเตรียม", ready:"พร้อมรับแล้ว!" };
const STATUS_STEPS = ["สั่งแล้ว","ยืนยัน","พร้อมรับ"];
const STATUS_STEP_NUM = { pending:0, accepted:1, ready:2 };

let lastKnownStatus   = localStorage.getItem("myOrderStatus") || "";
let lastRenderedStatus = "";

function renderOrderBar(order) {
  const bar = document.getElementById("myOrderBar");
  if (!bar || !order) return;
  const st = order.status || "pending";
  const items = typeof order.items === "string" ? JSON.parse(order.items) : order.items;
  const step = STATUS_STEP_NUM[st] ?? 0;

  const stepHTML = STATUS_STEPS.map((s,i) => `
    <div class="step-item">
      <div class="step-dot ${i<=step?"done":""}"></div>
      <div class="step-label ${i===step?"active":""}">${s}</div>
    </div>
    ${i < STATUS_STEPS.length-1 ? `<div class="step-line ${i<step?"done":""}"></div>` : ""}
  `).join("");

  bar.style.display = "block";
  bar.innerHTML = `
    <div class="order-status-card">
      <div class="osc-top">
        <div class="osc-icon-wrap ${st}"><i data-lucide="${STATUS_ICON[st]||"clock"}"></i></div>
        <div>
          <div class="osc-title">${STATUS_LABEL[st]||""}</div>
          <div class="osc-sub">ออเดอร์ #${String(order.order_seq || order.id).padStart(4,"0")} · ${order.name} · ${items.map(i=>`${i.name}×${i.qty}`).join(", ")}</div>
        </div>
      </div>
      <div class="step-bar">${stepHTML}</div>
      ${st === "ready" ? `<button class="btn-new-order" onclick="clearMyOrder()">รับของแล้ว — สั่งใหม่</button>` : ""}
    </div>`;
  lucide.createIcons();
}

async function checkMyOrderStatus() {
  const myId = localStorage.getItem("myOrderId");
  if (!myId) return;
  const { data } = await sb.from("orders").select("*").eq("id", myId).single();
  if (!data) return;
  if (data.status !== lastKnownStatus && lastKnownStatus !== "") {
    if (data.status === "accepted" || data.status === "ready") playNotify();
  }
  lastKnownStatus = data.status;
  localStorage.setItem("myOrderStatus", data.status);
  if (data.status !== lastRenderedStatus) {
    lastRenderedStatus = data.status;
    renderOrderBar(data);
  }
}

let realtimeSub = null;
function subscribeMyOrder() {
  const myId = localStorage.getItem("myOrderId");
  if (!myId) return;
  if (realtimeSub) realtimeSub.unsubscribe();
  realtimeSub = sb.channel("os-" + myId)
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "orders" }, payload => {
      if (String(payload.new.id) === String(myId)) {
        if (payload.new.status !== lastKnownStatus) playNotify();
        lastKnownStatus = payload.new.status;
        localStorage.setItem("myOrderStatus", payload.new.status);
        lastRenderedStatus = "";
        checkMyOrderStatus();
      }
    }).subscribe();
  // Also poll order status every 3 seconds as fallback
  setInterval(checkMyOrderStatus, 3000);
}

function clearMyOrder() {
  localStorage.removeItem("myOrderId"); localStorage.removeItem("myOrderStatus");
  lastKnownStatus = ""; lastRenderedStatus = "";
  if (realtimeSub) { realtimeSub.unsubscribe(); realtimeSub = null; }
  const bar = document.getElementById("myOrderBar");
  bar.style.display = "none"; bar.innerHTML = "";
}

// ===== NOTIFY =====
function requestNotifyPermission() {
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
}
function playNotify() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [523,659,784].forEach((f,i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = f;
      g.gain.setValueAtTime(0.25, ctx.currentTime + i*0.15);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.15 + 0.3);
      o.start(ctx.currentTime + i*0.15);
      o.stop(ctx.currentTime + i*0.15 + 0.3);
    });
  } catch(e) {}
}

function closeModal() { document.getElementById("modalOverlay").classList.remove("show"); }
function scrollToCart() { document.getElementById("cartBox").scrollIntoView({ behavior:"smooth", block:"center" }); }

// ===== INIT =====
renderMenu(); renderCart(); initTags();

// Tab switching
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchCategory(btn.dataset.category));
});

checkMyOrderStatus().then(() => { lastRenderedStatus = lastKnownStatus; subscribeMyOrder(); });
requestNotifyPermission();
lucide.createIcons();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { pollShopState(); checkMyOrderStatus(); }
});
</script>
